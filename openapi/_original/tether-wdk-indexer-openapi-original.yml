  /api/v1/batch/token-balances:
    post:
      summary: Get token balances for multiple addresses
      tags:
        - Token Balances
      description: Retrieve the current token balance for multiple addresses in a
        single request. Each item in the batch is processed independently - if
        one item fails (e.g. invalid address), the others still return results.
        The response array maintains the same order as the request. Maximum 10
        items per batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: Array of balance query objects. Maximum 10 items.
              minItems: 1
              maxItems: 10
              items:
                type: object
                properties:
                  blockchain:
                    type: string
                    enum:
                      - ethereum
                      - arbitrum
                      - avalanche
                      - polygon
                      - sepolia
                      - tron
                      - ton
                      - bitcoin
                      - spark
                    description: Blockchain network identifier.
                  token:
                    type: string
                    enum:
                      - usdt
                      - xaut
                      - usat
                      - btc
                    description: Token identifier.
                  address:
                    type: string
                    minLength: 1
                    description: Wallet address to query.
                required:
                  - blockchain
                  - token
                  - address
                additionalProperties: false
        description: Array of balance query objects. Maximum 10 items.
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Array of results in the same order as the request. Each element is
            either a balance result or an error object.
          content:
            application/json:
              schema:
                description: Array of results in the same order as the request. Each element is
                  either a balance result or an error object.
                type: array
                items:
                  oneOf:
                    - description: Current token balance for the queried address
                      type: object
                      properties:
                        tokenBalance:
                          type: object
                          description: Balance information.
                          properties:
                            blockchain:
                              type: string
                              description: Blockchain queried.
                            token:
                              type: string
                              description: Token queried.
                            amount:
                              type: string
                              description: Current balance as a decimal string.
                          additionalProperties: false
                      additionalProperties: false
                    - type: object
                      properties:
                        error:
                          type: string
                        message:
                          type: string
                        status:
                          type: number
                      additionalProperties: false
        "400":
          description: Bad Request - invalid parameters, address format, blockchain, or
            token
          content:
            application/json:
              schema:
                description: Bad Request - invalid parameters, address format, blockchain, or
                  token
                type: object
                properties:
                  error:
                    type: string
                    description: Error type
                  message:
                    type: string
                    description: Human-readable error description
                  status:
                    type: number
                    description: HTTP status code
                additionalProperties: false
        "401":
          description: Unauthorized - expired API key
          content:
            application/json:
              schema:
                description: Unauthorized - expired API key
                type: object
                properties:
                  error:
                    type: string
