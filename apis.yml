apis:
- aid: tether:wdk-indexer
  name: WDK Indexer API
  description: 'The WDK Indexer REST API provides read access to token balances and
    token-transfer history across Ethereum, Arbitrum, Avalanche, Polygon, Sepolia,
    Tron, TON, Bitcoin, Spark and Plasma for USD₮, XAU₮, USA₮ and BTC. Nine operations
    cover health, chain/token discovery, API-key self-service, single-address balances
    and transfers, and batch balance/transfer lookups. Authentication is an X-API-KEY
    header issued through a free registration form; per-endpoint rate limits are published.'
  humanURL: https://docs.wdk.tether.io/tools/indexer-api
