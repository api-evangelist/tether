aid: tether
name: Tether
description: 'Tether Operations Limited is the issuer of USD₮ (USDT), the largest
  stablecoin by circulating supply, along with XAU₮ (gold-backed), USA₮ and EUR₮ tokens
  issued across Ethereum, Tron, TON, Solana, Bitcoin/Liquid, Avalanche, Polygon, Arbitrum,
  Plasma and other chains. Beyond token issuance, Tether ships a developer surface
  centred on the open-source Wallet Development Kit (WDK) — a modular, self-custodial
  multi-chain wallet framework distributed as @tetherto/* npm packages, a WDK CLI,
  a React Native UI kit, an MCP Toolkit that exposes 35 wallet, pricing, indexer, swap,
  bridge, lending and fiat tools to AI agents, a published Agent Skill, and the hosted
  WDK Indexer REST API (wdk-api.tether.io) for token balances and transfer history.
  Tether also operates the QVAC local-AI SDK, the Tether Wallet app, and a public bug-bounty
  program.'
