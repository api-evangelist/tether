  - module: wallet-ton
    version: 1.0.0-beta.12
    highlight: Version-only source update plus dev lockfile refresh (fast-uri 3.1.2 → 3.1.4).
  - module: wallet-ton-gasless
    version: 1.0.0-beta.8
    highlight: Version-only source update plus dev lockfile refresh.
  - module: swidge-symbiosis
    version: 1.2.0
    highlight: >-
      30-second default API timeout, configurable X-Partner-Id, positive-integer
      amount validation, non-zero allowance reset before approval. TON joins Tron
      and Solana as quote-only; Monero and Zcash custodial routes excluded.
- date: '2026-07-29'
