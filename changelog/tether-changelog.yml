- date: '2026-08-01'
  additions:
  - module: swidge-symbiosis
    version: 1.3.0
    highlight: >-
      Execute TON, Tron and Solana source routes when the bound wallet account
      supports the required transaction format, probed at execution time. Wallets
      without the capability keep quote-only behaviour and throw UnsupportedRouteError.
      Adds a runnable end-to-end quote/execute/track example.
  breaking: []
- date: '2026-07-30'
  additions:
  - module: wdk-core
    version: 1.0.0-beta.15
    highlight: >-
      Global and account-scoped SDA protocol registration, getSdaProtocol(), and
      policy coverage for deposit-address creation, renewal, recovery and
      disablement. Governed proxies now hide keyPair and underscore-prefixed
      members from direct access and own-property reflection, and reject freezing.
  - module: wallet-evm-erc-4337
    version: 1.0.0-beta.14
    highlight: >-
      Opt-in ERC-4337 nonce lanes via `parallel` and `nonceKey` for sign, send and
      transfer, replacing local sequential nonce reservation.
  - module: create-wdk-module
    version: 1.0.0-beta.3
    highlight: Adds the `sda` scaffold type and wdk-protocol-sda-<provider> template.
  breaking:
  - module: wdk-utils
    version: 1.0.0-beta.11
    highlight: >-
      [Breaking] CAIP-2-aware validateAddress() dispatch for Bitcoin, EVM, Solana,
      Spark and Tron. Bitcoin success results replace `network` with
      `compatibleNetworks` and rename mainnet to `bitcoin`.
  fixes:
  - module: worklet-bundler
    version: 1.0.0-beta.7
    highlight: >-
      Check root, nested, scoped and symlinked package trees before deferring an
      optional peer, preventing MODULE_NOT_FOUND at runtime.
  changes:
  - module: wallet-btc
    version: 1.0.0-beta.12
