x-note: >-
  Tether ships client-side UI components as a NATIVE MOBILE component library, not
  as web components or hosted/embedded iframes. There is no JS element library, no
  hosted checkout surface and no embedded dashboard — the whole point of WDK is that
  nothing is hosted. Recorded as the shape it actually has.
