summary: >-
  Tether's agent surface (WDK MCP Toolkit, 34 documented tools) and its only public
  REST surface (the WDK Indexer API, 9 operations) barely overlap. The MCP toolkit is
  a LOCAL, self-custodial wallet server: almost every tool executes against chain RPC
  endpoints and DeFi protocol contracts through WDK wallet modules, not against a
  Tether-hosted HTTP API. Exactly two MCP tools are backed by the public REST API —
  the indexer pair — and they are the only rows with a real binding. Conversely the
  REST API's key-management operations have no MCP tool at all. This is a genuine
  surface divergence, recorded rather than papered over.
