server:
  name: wdk
  product: WDK MCP Toolkit
  package: '@tetherto/wdk-mcp-toolkit'
  repository: https://github.com/tetherto/wdk-mcp-toolkit
  transport: stdio
  hosted: false
  url: null
  x-note: >-
    There is NO remote/hosted MCP endpoint. The WDK MCP Toolkit is a library that
    extends the official @modelcontextprotocol/sdk McpServer; developers run it
    locally over stdio with their own BIP-39 seed. A second, ready-made stdio server
    ships as the `wdk-mcp` binary inside @tetherto/wdk-cli. Because keys stay on the
    operator's machine by design, a hosted tools/list endpoint does not exist and
    was not probed for.
  status_note: 'Beta — docs record v1.0.0-beta.1; APIs may change between releases.'
alternate_servers:
- name: wdk-mcp
  package: '@tetherto/wdk-cli'
  transport: stdio
  description: Bundled MCP server exposing the WDK CLI's local wallet daemon to
    MCP clients. Automated setup supported for Claude Desktop, Claude Code and
    OpenClaw via `wdk mcp`.
  docs: https://docs.wdk.tether.io/cli/guides/use-mcp-server
